version: '3.8'

services:
  sih26079-app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sih26079-forecast-reliability
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATA_MODE=REPLAY
      - PORT=8000
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
